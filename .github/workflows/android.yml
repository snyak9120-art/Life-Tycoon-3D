name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  export:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare build folder
        run: mkdir -p build
      - name: Export Android debug APK
        run: godot --headless --verbose --export-debug "Android" build/LifeTycoon3D-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LifeTycoon3D-debug-apk
          path: build/LifeTycoon3D-debug.apk
          if-no-files-found: error
