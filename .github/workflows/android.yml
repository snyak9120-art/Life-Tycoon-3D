name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  export:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Android SDK components required by Godot 4.4
        run: |
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" "build-tools;34.0.0" "platforms;android-34" \
            "cmdline-tools;latest" "cmake;3.10.2.4988404" "ndk;23.2.8568313"

      - name: Install matching Godot Android export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz -O /tmp/godot-templates.tpz
          unzip -oq /tmp/godot-templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.4.1.stable/"

      - name: Configure Android export tools
        run: |
          apt-get update
          apt-get install -y openjdk-17-jdk
          JAVA_BIN="$(readlink -f "$(command -v javac)")"
          JAVA_HOME="$(dirname "$(dirname "$JAVA_BIN")")"
          export JAVA_HOME
          test -x "$JAVA_HOME/bin/javac"
          echo "HOME=$HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "JAVA_HOME=$JAVA_HOME"
          echo "JAVAC=$JAVA_BIN"
          command -v java
          command -v keytool
          mkdir -p "$HOME/.config/godot"
          keytool -genkeypair -noprompt -keyalg RSA -keysize 2048 -validity 10000 \
            -alias androiddebugkey -keystore "$HOME/debug.keystore" \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"
          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          cat "$HOME/.config/godot/editor_settings-4.4.tres"

      - name: Prepare build folder
        run: mkdir -p build

      - name: Validate project
        run: godot --headless --path . --editor --quit --verbose

      - name: Export Android debug APK
        run: godot --headless --path . --export-debug "Android" build/LifeTycoon3D-debug.apk --verbose

      - name: Verify APK
        run: |
          test -s build/LifeTycoon3D-debug.apk
          jarsigner -verify build/LifeTycoon3D-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LifeTycoon3D-debug-apk
          path: build/LifeTycoon3D-debug.apk
          if-no-files-found: error
